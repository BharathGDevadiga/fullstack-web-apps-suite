<!DOCTYPE html>
<html>
<head>
    <title>CHAN's Cinema</title>
    <style>
        body {
            background: linear-gradient(red, purple);
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: goldenrod;
            font-size: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        h2 {
            color: ghostwhite;
            font-size: 35px;
        }
        h6 {
            color: white;
        }
        .movie {
            border: 5px solid orange;
            border-radius: 10px;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .movie:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 15px rgba(255, 165, 0, 0.5);
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            flex-direction: column;
            align-items: center;
        }
        button {
            background-color: orange;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: darkorange;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Heading -->
    <h1>C H A N's Cinema</h1>
    <!-- Movies Row -->
    <iv class="container">
        <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">

            <img class="movie" src="images/BAT.JPG" width="250" height="350" alt="Batman Movie Poster">
            <img class="movie" src="images/SPIDER.PNG" width="250" height="350" alt="Spider-Man Movie Poster">
        </div>

    <!-- 4th Movie -->
